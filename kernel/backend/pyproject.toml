[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "kernel"
version = "0.1.0"
description = "Innostes ERP Kernel: Core configuration, database engine, module lifecycle, and security"
requires-python = ">=3.10"
dependencies = [
    "fastapi[standard]>=0.158",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "python-dotenv>=1.0.0",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "pyjwt>=2.8.0",
    "cryptography>=42.0.0",
    "bcrypt>=4.0.0",
]

# Plug-ins loaded automatically by apps/api-server (see ModuleLoader.discover).
[project.entry-points."innostes.modules"]
setup = "kernel.setup:module"
tenancy = "kernel.tenancy:module"
user = "kernel.user:module"
auth = "kernel.auth:module"

[tool.setuptools.packages.find]
where = ["."]
include = ["kernel*"]
