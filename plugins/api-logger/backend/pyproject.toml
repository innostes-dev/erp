[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "innostes-api-logger"
version = "0.1.0"
description = "Innostes ERP API Logger Extensible Plugin"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "kernel",
    "fastapi>=0.115",
]

[project.entry-points."innostes.plugins"]
api_logger = "api_logger:plugin"

[tool.setuptools.packages.find]
where = ["."]
include = ["api_logger*"]
