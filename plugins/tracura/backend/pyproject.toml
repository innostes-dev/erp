[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "innostes-tracura"
version = "0.1.0"
description = "Innostes ERP Tracura API Observability & Telemetry Extensible Plugin"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "kernel",
    "fastapi>=0.115",
]

[project.optional-dependencies]
redis = ["redis>=5.0.0"]

[project.entry-points."innostes.plugins"]
tracura = "tracura:plugin"
api_logger = "tracura:plugin"

[tool.setuptools.packages.find]
where = ["."]
include = ["tracura*"]
