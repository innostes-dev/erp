[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "innostes-peopleops"
version = "0.1.0"
description = "Innostes ERP PeopleOps Business Module"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "kernel",
    "fastapi>=0.115",
]

[project.entry-points."innostes.modules"]
peopleops = "peopleops:module"

[tool.setuptools.packages.find]
where = ["."]
include = ["peopleops*"]
