[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "innostes-revops"
version = "0.1.0"
description = "Innostes ERP RevOps Business Module"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "kernel",
    "fastapi>=0.115",
]

[project.entry-points."innostes.modules"]
revops = "revops:module"

[tool.setuptools.packages.find]
where = ["."]
include = ["revops*"]
